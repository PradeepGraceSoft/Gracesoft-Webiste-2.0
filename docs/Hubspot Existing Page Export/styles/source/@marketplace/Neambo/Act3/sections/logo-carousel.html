<!--
 templateType: section
 label: Logo carousel
 description: "Enables you to show off your most prestigious clients or business partners using their well known logos, in a nice slider/carousel. You may need to save and reload the editor."
 isAvailableForNewContent: true
 screenshotPath: ../images/section-previews/logo-carousel.jpg
-->
{% dnd_section
  max_width=1280,
  padding={
    'default': {
      'top': 60,
      'bottom': 60
    }
  }
%}
  {% dnd_column %}
    {% dnd_row %}
      {% dnd_module path='../modules/logos',
        wrapper={
          'text_align': {
            'lg': 'center'
          }
        }
      %}{% end_dnd_module %}
    {% end_dnd_row %}
  {% end_dnd_column %}
{% end_dnd_section %}
