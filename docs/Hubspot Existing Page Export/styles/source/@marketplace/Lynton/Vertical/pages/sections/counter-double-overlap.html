<!--
  templateType: section
  label: Counter with Overlap
  description: "A list of stats with animated counter overlapping section above it. >> Section above this must have a background different from this section's for the overlap to be apparent."
  isAvailableForNewContent: true
  screenshotPath: ../../assets/screenshots/sections/counter-double-overlap.png
-->

{% dnd_section max_width=1200, background_color="{{ theme.global.colors.background_dark.color }}" %}
  {% dnd_module path="../modules/Counter" styles={
    "module": {
      "add_overlap": {
        "overlap": "above",
        "overlap_height": "half"
      }
    }
  } %}
  {% end_dnd_module %}
{% end_dnd_section %}
