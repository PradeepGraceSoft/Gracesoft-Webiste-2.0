<section class="insights section-space section-light" id="insights"><div class="container"><div class="section-heading"><h2 class="preserve-lines">{{ module.heading|escape_html }}</h2><a class="text-link" href="{{ module.url.href|escape_url }}">{{ module.label|escape_html }} <span aria-hidden="true">↗</span></a></div><div class="article-grid">{% for item in module.articles %}<article><a class="article-image" href="{{ item.url.href|escape_url }}" tabindex="-1" aria-hidden="true"><img src="{{ (item.image.src or get_asset_url('../../assets/' ~ item.fallback))|escape_url }}" alt="{{ item.image.alt|escape_attr }}" width="720" height="440" loading="lazy"></a><div class="article-meta"><span>{{ item.category|escape_html }}</span><time datetime="{{ item.datetime|escape_attr }}">{{ item.date|escape_html }}</time></div><h3><a href="{{ item.url.href|escape_url }}">{{ item.title|escape_html }} <span aria-hidden="true">↗</span></a></h3><p>{{ item.body|escape_html }}</p></article>{% endfor %}</div></div></section>
