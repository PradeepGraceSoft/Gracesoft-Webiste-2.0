<section class="overview section-light" id="overview"><div class="container"><h2>{{ module.heading|escape_html }}</h2><div class="workflow-strip">{% for item in module.links %}<a href="{{ item.url.href|escape_url }}"><span class="workflow-symbol" aria-hidden="true">{{ loop.index|string }}</span>{{ item.label|escape_html }} <span aria-hidden="true">↗</span></a>{% endfor %}</div><div class="definition"><h3>{{ module.definition_heading|escape_html }}</h3><div><p>{{ module.definition|escape_html }}</p><p class="fine-print">{{ module.qualification|escape_html }}</p></div></div></div></section>
