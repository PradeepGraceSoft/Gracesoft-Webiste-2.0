<section class="journey section-space"><div class="container"><div class="section-heading"><h2 class="preserve-lines">{{ module.heading|escape_html }}</h2><p>{{ module.intro|escape_html }}</p></div><div class="journey-steps">{% for item in module.steps %}<article><div class="step-track"><span>{{ item.number|escape_html }}</span><i aria-hidden="true"></i></div><h3>{{ item.title|escape_html }}</h3><p>{{ item.body|escape_html }}</p><a class="text-link" href="{{ item.url.href|escape_url }}">{{ item.label|escape_html }} <span aria-hidden="true">↗</span></a></article>{% endfor %}</div></div></section>
