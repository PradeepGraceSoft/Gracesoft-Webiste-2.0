<section class="properties section-space" id="properties"><div class="container"><div class="section-heading"><div><p class="eyebrow">{{ module.eyebrow|escape_html }}</p><h2 class="preserve-lines">{{ module.heading|escape_html }}</h2></div><p>{{ module.intro|escape_html }}</p></div><div class="property-grid">{% for item in module.properties %}<a class="property-card property-{{ loop.index }}" href="{{ item.url.href|escape_url }}"><span class="property-number">{{ item.number|escape_html }}</span><div class="property-art" aria-hidden="true"><i></i><i></i><i></i><b></b></div><h3>{{ item.title|escape_html }} <span aria-hidden="true">↗</span></h3><p>{{ item.body|escape_html }}</p></a>{% endfor %}</div><a class="text-link" href="{{ module.ranch_url.href|escape_url }}">{{ module.ranch_label|escape_html }} <span aria-hidden="true">↗</span></a></div></section>
