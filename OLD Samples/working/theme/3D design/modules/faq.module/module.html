<section class="faq section-space"><div class="container faq-grid"><div><h2 class="preserve-lines">{{ module.heading|escape_html }}</h2><p>{{ module.body|escape_html }}</p><a class="text-link" href="{{ module.url.href|escape_url }}">{{ module.label|escape_html }} <span aria-hidden="true">↗</span></a></div><div class="faq-list">{% for item in module.questions %}<details><summary>{{ item.question|escape_html }}<span aria-hidden="true">+</span></summary><p>{{ item.answer|escape_html }}</p></details>{% endfor %}</div></div></section>
